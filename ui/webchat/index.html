<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>XClaw</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <div class="brand">
          <span class="brand-mark">🦞</span>
          <div class="brand-text">
            <span class="brand-name">XClaw</span>
            <span class="brand-sub" id="brand-sub">gateway</span>
          </div>
        </div>
        <button id="btn-collapse" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">⟨</button>
      </div>

      <button id="btn-new" class="new-chat">＋&nbsp; New chat</button>

      <nav id="session-list" class="session-list" aria-label="Sessions"></nav>

      <div class="side-foot">
        <div class="status-grid" id="status-grid">
          <div class="st"><span class="st-dot" id="st-gw"></span>Gateway</div>
          <div class="st"><span class="st-dot" id="st-comp"></span>Computer</div>
          <div class="st st-model" id="st-model" title="model">—</div>
        </div>
        <div class="side-links">
          <a href="/control/" target="_blank" rel="noopener">Control</a>
          <span>·</span>
          <a href="/health" target="_blank" rel="noopener">Health</a>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="chat-head">
        <button id="btn-sidebar" class="icon-btn only-mobile" aria-label="Sessions">☰</button>
        <div class="head-title">
          <span id="head-session">New conversation</span>
          <span id="head-meta" class="head-meta"></span>
        </div>
        <label class="job-toggle" title="Job mode: verify + evidence">
          <input type="checkbox" id="mode-job" />
          <span>Job mode</span>
        </label>
      </header>

      <div id="scroll" class="scroll">
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="landing" class="landing">
          <div class="landing-mark">🦞</div>
          <h1>What should XClaw do?</h1>
          <p class="landing-sub">Shell, files, browser, images, finance — with approvals, budgets and receipts.</p>
          <div class="landing-chips" id="landing-chips">
            <button class="chip" data-q="List the files in your workspace and describe what's there.">List files</button>
            <button class="chip" data-q="Show system info: OS, uptime, disk and memory usage — in a table.">System info</button>
            <button class="chip" data-q="Generate an image of a crimson lobster piloting a spaceship.">Generate an image</button>
            <button class="chip" data-q="What tools do you have? Group them by what they're for.">What can you do?</button>
          </div>
        </div>
      </div>

      <footer id="composer-wrap">
        <div id="composer">
          <textarea id="input" rows="1" placeholder="Message XClaw…  ( / for commands )" aria-label="Message"></textarea>
          <button id="btn-stop" class="stop-btn" hidden title="Stop">■</button>
          <button id="send" class="send-btn" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="composer-hint">Enter to send · Shift+Enter for newline · <code>/pending</code> <code>/approve</code> <code>/help</code></div>
      </footer>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
