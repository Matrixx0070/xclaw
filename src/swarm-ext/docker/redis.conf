# XClaw Swarm Redis Configuration
# Optimized for task queue, pub/sub, and session storage

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots every 5 min if 1+ key changed)
save 300 1
save 60 100
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Append-only file (AOF) for durability
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Networking
bind 0.0.0.0
port 6379
tcp-keepalive 300
timeout 0

# Limits
tcp-backlog 511
maxclients 10000

# Logging
loglevel notice

# Disable dangerous commands in production (optional)
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""
