version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: xclaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xclaw-swarm

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    container_name: xclaw-orchestrator
    ports:
      - "18790:18790"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_RESULT_URL=redis://redis:6379/1
      - XCLAW_PROFILE=prod
      - XCLAW_GATEWAY_TOKEN=${XCLAW_GATEWAY_TOKEN:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - orchestrator-logs:/app/logs
      - ../data:/app/data
    networks:
      - xclaw-swarm
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    restart: unless-stopped

  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    container_name: xclaw-sandbox
    privileged: false
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - xclaw-swarm
    profiles:
      - sandbox

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: xclaw-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - xclaw-swarm
    profiles:
      - observability

volumes:
  redis-data:
  orchestrator-logs:
  prometheus-data:

networks:
  xclaw-swarm:
    driver: bridge
