name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: N10 kill-switch wires
        run: node scripts/apply-n10-wires.mjs --check

      - name: N10 freeze tests
        run: node --test test/job-resume-collector.test.mjs test/checkpoint-circuit-roundtrip.test.mjs test/fire-drill-post-offline-guard.test.mjs test/openapi-dryrun-response.test.mjs test/stop-health-surface.test.mjs || node --test test/openapi-dryrun-response.test.mjs test/fire-drill-post-offline.test.mjs

      - name: CI gate (unit + skills + p2 + C4)
        run: node scripts/ci-gate.mjs

      - name: Live multistep eval
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XCLAW_CI_LIVE: "1"
          XCLAW_PROFILE: lab
          XCLAW_COMPUTER_ENGINE: native
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "SKIP live eval (no XAI_API_KEY secret)"
            exit 0
          fi
          node scripts/ci-gate.mjs --live
        continue-on-error: true
