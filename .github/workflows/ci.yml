name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi

      - name: C4 computer parity
        run: node scripts/check-computer-parity.mjs

      - name: C3 computer build
        run: node scripts/build-computer-bundle.mjs

      - name: CI gate (unit + skills + p2 + C4)
        run: node scripts/ci-gate.mjs

      - name: Live multistep eval
        if: ${{ secrets.XAI_API_KEY != '' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XCLAW_CI_LIVE: "1"
          XCLAW_PROFILE: lab
        run: node scripts/ci-gate.mjs --live
        continue-on-error: true
