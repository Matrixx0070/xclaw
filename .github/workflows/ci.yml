name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Unit/agent tests need a computer. Bundle is not in git; use native escape hatch on CI.
    env:
      XCLAW_COMPUTER_ENGINE: native
      XCLAW_BUNDLE_AUTOFETCH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: C4 computer parity
        run: node scripts/check-computer-parity.mjs

      - name: C3 computer build
        run: node scripts/build-computer-bundle.mjs

      - name: CI gate (unit + skills + p2 + C4)
        run: node scripts/ci-gate.mjs

      - name: Live multistep eval
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XCLAW_CI_LIVE: "1"
          XCLAW_PROFILE: lab
          XCLAW_COMPUTER_ENGINE: native
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "SKIP live eval (no XAI_API_KEY secret)"
            exit 0
          fi
          node scripts/ci-gate.mjs --live
        continue-on-error: true
