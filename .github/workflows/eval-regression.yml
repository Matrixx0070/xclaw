name: eval-regression

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit regression pack
        run: node scripts/eval-regression.mjs
      - name: Security + plan binding packs
        run: |
          node --test \
            test/system-run-plan.test.mjs \
            test/system-run-plan-gate.test.mjs \
            test/plan-revalidate-loop.test.mjs \
            test/gateway-auth-require.test.mjs \
            test/agent-history.test.mjs \
            test/egress.test.mjs \
            test/session-control.test.mjs \
            test/session-kill-loop.test.mjs

      - name: Autonomy + prod hardening + self-test
        run: |
          node --test \
            test/autonomy-policy.test.mjs \
            test/prod-hardening.test.mjs \
            test/sandbox-tmp-allow.test.mjs \
            test/skill-install-gate.test.mjs \
            test/heartbeat-delivery.test.mjs \
            test/browser-profile-default.test.mjs \
            test/browser-observe-hybrid.test.mjs \
            test/host-workspace.test.mjs
          node bin/xclaw.mjs self-test

      - name: Browser fabric (leases, gates, hooks)
        run: |
          node --test \
            test/browser-physics.test.mjs \
            test/browser-hooks-a3.test.mjs \
            test/browser-hooks.test.mjs \
            test/browser-a8-fabric.test.mjs \
            test/bounded-queue.test.mjs \
            test/checkpoint.test.mjs \
            test/long-horizon-fixtures.test.mjs \
            test/long-harness.test.mjs \
            test/cost-governor.test.mjs \
            test/approvals-inbox.test.mjs \
            test/browser-mark-click.test.mjs \
            test/agent-run-store.test.mjs \
            test/telegram-callback-auth.test.mjs \
            test/telegram-prod-policy.test.mjs
      - name: OAuth + P5/P6 packs
        run: |
          node --test \
            test/oauth-retry.test.mjs \
            test/oauth-errors.test.mjs \
            test/token-refresh.test.mjs \
            test/token-refresh-mock.test.mjs \
            test/oauth-browser.test.mjs \
            test/vault.test.mjs || true

  # Media path: real ffmpeg so view_x_video is exercised (not skipped).
  unit-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache apt packages (ffmpeg)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: ffmpeg
          version: ffmpeg-ci-v1
      - name: Verify ffmpeg
        run: ffmpeg -version | head -2
      - name: P1 media tools (view_x_video + images)
        run: node --test test/p1-tools.test.mjs

  # OS sandbox: real bubblewrap so bwrap path is exercised (not skipped).
  unit-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache apt packages (bubblewrap)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: bubblewrap
          version: bwrap-ci-v1
      - name: Verify bwrap
        run: bwrap --version
      - name: OS sandbox + spawn enforce
        env:
          XCLAW_OS_SANDBOX: bwrap
          XCLAW_OS_SANDBOX_NET: deny
        run: |
          node --test \
            test/os-sandbox.test.mjs \
            test/spawn-enforce.test.mjs \
            test/os-sandbox-bwrap-live.test.mjs

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live eval-ci (skipped if no XAI_API_KEY secret)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          EVAL_LIVE: "1"
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "No XAI_API_KEY secret — skipping live eval"
            exit 0
          fi
          node scripts/eval-regression.mjs
