# Optional: computer on separate service
# Usage: docker compose -f docker-compose.sidecar.yml up --build

services:
  computer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "bin/xclaw.mjs", "computer"]
    environment:
      XCLAW_COMPUTER_HOST: "0.0.0.0"
      XCLAW_COMPUTER_PORT: "4243"
      XCLAW_SERVER_PORT: "4243"
      XCLAW_HOME: /data
      HOME: /data
    expose:
      - "4243"
    volumes:
      - xclaw-computer:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4243/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      XAI_API_KEY: ${XAI_API_KEY:-}
      XCLAW_API_KEY: ${XCLAW_API_KEY:-}
      # Required: XCLAW_GATEWAY_HOST below is 0.0.0.0 and the port is published
      # on every host interface, so the gateway refuses to start unauthenticated
      # (bind guard). Generate once: openssl rand -hex 32 >> .env
      XCLAW_GATEWAY_TOKEN: ${XCLAW_GATEWAY_TOKEN:?set XCLAW_GATEWAY_TOKEN in deploy/.env — e.g. echo "XCLAW_GATEWAY_TOKEN=$(openssl rand -hex 32)" >> deploy/.env}
      XCLAW_PROFILE: ${XCLAW_PROFILE:-prod}
      XCLAW_GATEWAY_HOST: "0.0.0.0"
      XCLAW_GATEWAY_PORT: "18790"
      # Point at sidecar (disables in-process computer autoStart path when set)
      XCLAW_COMPUTER_URL: http://computer:4243
      XCLAW_HOME: /data
      HOME: /data
    ports:
      - "${XCLAW_GATEWAY_PORT:-18790}:18790"
    depends_on:
      - computer
    volumes:
      - xclaw-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18790/ready"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  xclaw-data:
  xclaw-computer:
