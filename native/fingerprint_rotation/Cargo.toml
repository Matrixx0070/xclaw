[package]
name = "xclaw-fingerprint-rotation"
version = "0.1.0"
edition = "2021"
description = "XClaw web-session fingerprint rotation with dual-window verify"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
