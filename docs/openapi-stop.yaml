openapi: 3.0.3
info:
  title: XClaw single-port stop + health
  version: "1.1"
  description: |
    Kill-switch contract. Operators: `xclaw stop --sign [--dry-run] [--print-curl]`.
    CI: `node scripts/stop-fire-drill.mjs`.
paths:
  /health:
    get:
      summary: Liveness + stop readiness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  stop:
                    type: object
                    properties:
                      auth: { type: string, enum: [token, lab, missing, disabled] }
                      hmac: { type: string, enum: [configured, off, missing, disabled] }
                      ready: { type: boolean }
                      singlePort: { type: boolean }
                      bashBg: { type: integer, description: Live background bash PIDs this process started }
  /ready:
    get:
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready (prod requires stop.ready)
  /stop:
    post:
      summary: Session kill-switch
      security:
        - bearerAuth: []
        - stopHmac: []
      parameters:
        - in: header
          name: Authorization
          schema: { type: string }
          description: Bearer gateway/stop token
        - in: header
          name: X-XClaw-Token
          schema: { type: string }
        - in: header
          name: X-XClaw-Stop-Sig
          schema: { type: string }
          description: hex HMAC-SHA256 of canonical body (stableStringify)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, example: stop }
                action: { type: string, example: stop-all }
                keepComputer: { type: boolean }
                closeWs: { type: boolean, default: true }
                closeSse: { type: boolean, default: true }
                dryRun:
                  type: boolean
                  description: Validate auth only; do not abort sessions
            examples:
              kill:
                value: { type: stop, action: stop-all }
              dryRun:
                value: { type: stop, dryRun: true }
      responses:
        "200":
          description: Drained (or dry-run auth ok)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dryRun: { type: boolean }
                  authMethod: { type: string, enum: [token, hmac, lab, disabled] }
                  drain:
                    type: object
                    properties:
                      sessionsKilled: { type: integer }
                      wsClosed: { type: integer }
                      sseClosed: { type: integer }
                      bashBgKilled: { type: integer }
                      bashBgListed: { type: integer }
                      authMethod: { type: string }
                      channel: { type: string, enum: [http, ws] }
                      dryRun: { type: boolean }
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
  /sessions/stop-all:
    post:
      summary: Alias of /stop
      responses:
        "200": { description: Drained }
        "401": { description: Unauthorized }
  /xclaw/stop:
    post:
      summary: Alias of /stop
      responses:
        "200": { description: Drained }
        "401": { description: Unauthorized }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    stopHmac:
      type: apiKey
      in: header
      name: X-XClaw-Stop-Sig

x-dry-run-response:
  description: Runtime payload when body.dryRun=true
  type: object
  required: [ok, dryRun, killedSessions]
  properties:
    ok: { type: boolean, example: true }
    dryRun: { type: boolean, example: true }
    killedSessions: { type: array, items: { type: string }, maxItems: 0 }
    authMethod: { type: string }
    message: { type: string }
    drain:
      type: object
      properties:
        bashBgListed: { type: integer }
