openapi: 3.0.3
info:
  title: XClaw single-port stop + health
  version: "1.0"
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  stop:
                    type: object
                    properties:
                      auth: { type: string, enum: [token, lab, missing, disabled] }
                      hmac: { type: string, enum: [configured, off, missing, disabled] }
                      ready: { type: boolean }
                      singlePort: { type: boolean }
  /ready:
    get:
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready (prod requires stop.ready)
  /stop:
    post:
      summary: Session kill-switch
      security:
        - bearerAuth: []
        - stopHmac: []
      parameters:
        - in: header
          name: Authorization
          schema: { type: string }
          description: Bearer gateway/stop token
        - in: header
          name: X-XClaw-Token
          schema: { type: string }
        - in: header
          name: X-XClaw-Stop-Sig
          schema: { type: string }
          description: hex HMAC-SHA256 of body using stop HMAC secret
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keepComputer: { type: boolean }
                closeWs: { type: boolean, default: true }
                closeSse: { type: boolean, default: true }
      responses:
        "200":
          description: Drained
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  authMethod: { type: string, enum: [token, hmac, lab, disabled] }
                  drain:
                    type: object
                    properties:
                      sessionsKilled: { type: integer }
                      wsClosed: { type: integer }
                      sseClosed: { type: integer }
                      authMethod: { type: string }
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
  /sessions/stop-all:
    post:
      summary: Alias of /stop
      responses:
        "200": { description: Drained }
        "401": { description: Unauthorized }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    stopHmac:
      type: apiKey
      in: header
      name: X-XClaw-Stop-Sig
